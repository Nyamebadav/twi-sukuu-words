<script>
const LINES=[{"id":"v001","section":"genesis1","source":"Genesis 1:1 (Asante Twi Nkwa Asɛm)","tw":"Ahyɛaseɛ no Onyankopɔn bɔɔ ɔsoro ne asase.","mp3":"audio/readings/v001.mp3","dur":3.5},{"id":"v002","section":"genesis1","source":"Genesis 1:2 (Asante Twi Nkwa Asɛm)","tw":"Na asase yɛ sakasaka ne hunu. Na esum kata nsubunu no ani. Na Onyankopɔn honhom butu nsuo no ani.","mp3":"audio/readings/v002.mp3","dur":9.038},{"id":"v003","section":"genesis1","source":"Genesis 1:3 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn hyɛɛ sɛ, ɛnyɛ hann! Na ɛyɛɛ hann.","mp3":"audio/readings/v003.mp3","dur":4.885},{"id":"v004","section":"genesis1","source":"Genesis 1:4 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn hunuu sɛ hann no yɛ enti, ɔtee hann no firii esum no ho.","mp3":"audio/readings/v004.mp3","dur":6.034},{"id":"v005","section":"genesis1","source":"Genesis 1:5 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn frɛɛ hann no sɛ adekyeeɛ, na esum no nso sɛ adesaeɛ. Adeɛ saeɛ na adeɛ kyeeɛ, ɛda a ɛdi ɛkan no no.","mp3":"audio/readings/v005.mp3","dur":11.99},{"id":"v006","section":"genesis1","source":"Genesis 1:6 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn kaa sɛ, “Nkyɛmu mmra nsuo no ntam, na ɛnkyekyɛ nsuo no mu.”","mp3":"audio/readings/v006.mp3","dur":7.131},{"id":"v007","section":"genesis1","source":"Genesis 1:7 (Asante Twi Nkwa Asɛm)","tw":"Enti, Onyankopɔn yɛɛ nkyɛmu no de kyekyɛɛ nsuo a ɛwɔ nkyɛmu no ase firii nsuo a ɛwɔ nkyɛmu no atifi no mu. Na ɛyɛɛ saa.","mp3":"audio/readings/v007.mp3","dur":12.199},{"id":"v008","section":"genesis1","source":"Genesis 1:8 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn too atifi nkyɛmu no edin ewiem. Na esum duruiɛ ɛnna adeɛ kyeeɛ; yei ne ɛda a ɛtɔ so mmienu.","mp3":"audio/readings/v008.mp3","dur":13.793},{"id":"v009","section":"genesis1","source":"Genesis 1:9 (Asante Twi Nkwa Asɛm)","tw":"Na Onyankopɔn kaa sɛ, “Nsuo a ɛwɔ nkyɛmu no ase no ano mmoa wɔ faako, na asase kesee nna ne ho adi.” Na ɛyɛɛ saa.","mp3":"audio/readings/v009.mp3","dur":12.957},{"id":"v010","section":"genesis1","source":"Genesis 1:10 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn too beaeɛ kesee no edin asase. Ɛnna nsuo a ɛboaa ne ho ano no nso, ɔtoo no edin ɛpo. Onyankopɔn hunuu sɛ ɛyɛ.","mp3":"audio/readings/v010.mp3","dur":13.322},{"id":"v011","section":"genesis1","source":"Genesis 1:11 (Asante Twi Nkwa Asɛm)","tw":"Afei, Onyankopɔn kaa sɛ, “Afifideɛ mfifiri asase so; afifideɛ a ɛso aba, nnuaba ahodoɔ a ɛso aba ne deɛ, nʼaba hyehyɛ mu nyinaa mfifiri asase so.” Na ɛyɛɛ saa.","mp3":"audio/readings/v011.mp3","dur":18.26},{"id":"v012","section":"genesis1","source":"Genesis 1:12 (Asante Twi Nkwa Asɛm)","tw":"Afifideɛ a ɛso aba ne nnua fifirii asase so na nʼaba no nyini yɛɛ nnua ne afifideɛ sɛ ne sɛso. Onyankopɔn hunuu sɛ, ɛyɛ.","mp3":"audio/readings/v012.mp3","dur":13.976},{"id":"v013","section":"genesis1","source":"Genesis 1:13 (Asante Twi Nkwa Asɛm)","tw":"Na adeɛ saeɛ ɛnna adeɛ kyeeɛ. Yei ne ɛda a ɛtɔ so mmiɛnsa.","mp3":"audio/readings/v013.mp3","dur":5.904},{"id":"v014","section":"genesis1","source":"Genesis 1:14 (Asante Twi Nkwa Asɛm)","tw":"Na Onyankopɔn kaa sɛ, “Hann mmra nkyɛmu a ɛwɔ ewiem no mu mmɛpae adekyeeɛ ne adesaeɛ mu. Na ɛmmɛyɛ nnyinasoɔ mma ɛberɛ nkyekyɛmu, nna ne mfeɛ","mp3":"audio/readings/v014.mp3","dur":13.793},{"id":"v015","section":"genesis1","source":"Genesis 1:15 (Asante Twi Nkwa Asɛm)","tw":"na ɛmma hann mmra nkyɛmu a ɛwɔ ewiem no mu, na ahyerɛn wɔ asase so.” Na ɛyɛɛ saa.","mp3":"audio/readings/v015.mp3","dur":8.176},{"id":"v016","section":"genesis1","source":"Genesis 1:16 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn yɛɛ nkanea akɛseɛ mmienu a ɛyɛ owia ne ɔbosome sɛ, owia no nni adekyeeɛ so na ɔbosome no nni anadwo so. Ɔbɔɔ nsoromma nso.","mp3":"audio/readings/v016.mp3","dur":14.367},{"id":"v017","section":"genesis1","source":"Genesis 1:17 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn de nkanea akɛseɛ mmienu yi sii nkyɛmu ewiem no mu sɛ, ɛnhyerɛn wɔ asase so,","mp3":"audio/readings/v017.mp3","dur":8.49},{"id":"v018","section":"genesis1","source":"Genesis 1:18 (Asante Twi Nkwa Asɛm)","tw":"na wɔnni adekyeeɛ ne adesaeɛ no so, na ɛnte hann no mfiri esum no ho. Na Onyankopɔn hunuu sɛ, ɛyɛ.","mp3":"audio/readings/v018.mp3","dur":9.221},{"id":"v019","section":"genesis1","source":"Genesis 1:19 (Asante Twi Nkwa Asɛm)","tw":"Na adeɛ saeɛ, ɛnna adeɛ kyeeɛ. Ɛda a ɛtɔ so ɛnan ne no.","mp3":"audio/readings/v019.mp3","dur":4.963},{"id":"v020","section":"genesis1","source":"Genesis 1:20 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn kaa sɛ, “Abɔdeɛ a nkwa wɔ mu nhyɛ nsuo no ma, na nnomaa ntu mfa asase ne nkyɛmu a ɛwɔ ewiem no so.”","mp3":"audio/readings/v020.mp3","dur":10.397},{"id":"v021","section":"genesis1","source":"Genesis 1:21 (Asante Twi Nkwa Asɛm)","tw":"Enti, Onyankopɔn bɔɔ ɛpo mu mmoa akɛseɛ ne mmoa ahodoɔ nyinaa a wɔwɔ nkwa na wɔkeka wɔn ho ne nnomaa ahodoɔ nyinaa. Na Onyankopɔn hunuu sɛ ɛyɛ.","mp3":"audio/readings/v021.mp3","dur":13.74},{"id":"v022","section":"genesis1","source":"Genesis 1:22 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn hyiraa abɔdeɛ no nyinaa so, ɛnna ɔkaa sɛ, “Monwo na monyɛ bebree na monhyɛ ɛpo no ma, na nnomaa ase ntrɛ wɔ asase so.”","mp3":"audio/readings/v022.mp3","dur":12.643},{"id":"v023","section":"genesis1","source":"Genesis 1:23 (Asante Twi Nkwa Asɛm)","tw":"Na adeɛ saeɛ ɛnna adeɛ kyeeɛ. Ɛda a, ɛtɔ so enum ne no.","mp3":"audio/readings/v023.mp3","dur":8.307},{"id":"v024","section":"genesis1","source":"Genesis 1:24 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn kaa sɛ, “Abɔdeɛ a nkwa wɔ mu ahodoɔ nyinaa ne wɔn sɛso, anantwie ne mmoa a wɔwea wɔn afuru so ne mmoa ahodoɔ a wɔyɛ keka a wɔwɔ asase so nyinaa mmra asase so.” Na ɛyɛɛ saa.","mp3":"audio/readings/v024.mp3","dur":19.958},{"id":"v025","section":"genesis1","source":"Genesis 1:25 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn bɔɔ mmoa ahodoɔ, anantwie ahodoɔ ne wɔn sɛso ne mmoa a, wɔwea wɔn afuru so ne wɔn sɛso. Na Onyankopɔn hunuu sɛ, ɛyɛ.","mp3":"audio/readings/v025.mp3","dur":12.251},{"id":"v026","section":"genesis1","source":"Genesis 1:26 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn kaa sɛ, “Momma yɛmmɔ onipa sɛ yɛn sɛso, na ɔnni ɛpo mu mpataa, ewiem nnomaa, anantwie ne mmoa a wɔyɛ keka ne biribiara a ɛwea nʼafuru so wɔ asase so.”","mp3":"audio/readings/v026.mp3","dur":18.965},{"id":"v027","section":"genesis1","source":"Genesis 1:27 (Asante Twi Nkwa Asɛm)","tw":"Enti, Onyankopɔn bɔɔ onipa sɛ ne sɛso; Onyankopɔn sɛso so na ɔbɔɔ wɔn; ɔbaa ne ɔbarima na ɔbɔɔ wɔn.","mp3":"audio/readings/v027.mp3","dur":9.064},{"id":"v028","section":"genesis1","source":"Genesis 1:28 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn hyiraa wɔn, ka kyerɛɛ wɔn sɛ, “Monwo na monyɛ asase so ma, na monni biribiara so. Monni ɛpo mu mpataa ne ewiem nnomaa ne abɔdeɛ biara a, nkwa wɔ mu a, ɛwɔ asase so no nyinaa so.”","mp3":"audio/readings/v028.mp3","dur":19.54},{"id":"v029","section":"genesis1","source":"Genesis 1:29 (Asante Twi Nkwa Asɛm)","tw":"Afei, Onyankopɔn kaa sɛ, “Mede asase so afifideɛ a ɛso aba nyinaa, afifideɛ biara a aba hyɛ ne nnuaba mu wɔ asase yi so nyinaa hyɛ wo nsa. Ɛbɛyɛ wʼaduane.","mp3":"audio/readings/v029.mp3","dur":15.778},{"id":"v030","section":"genesis1","source":"Genesis 1:30 (Asante Twi Nkwa Asɛm)","tw":"Mede nhahammono nyinaa ama aboa biara a ɔwɔ asase so, anomaa biara a ɔwɔ ewiem, biribiara a ɛwea nʼafuru so, biribiara a nkwa wɔ mu wɔ asase so sɛ wɔn aduane.” Na ɛyɛɛ saa.","mp3":"audio/readings/v030.mp3","dur":16.065},{"id":"v031","section":"genesis1","source":"Genesis 1:31 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn hwɛɛ deɛ wayɛ nyinaa hunuu sɛ ɛyɛ papa. Na adeɛ saeɛ na adeɛ kyeeɛ. Yei ne ɛda a ɛtɔ so nsia.","mp3":"audio/readings/v031.mp3","dur":10.658},{"id":"v032","section":"genesis2","source":"Genesis 2:1 (Asante Twi Nkwa Asɛm)","tw":"Yei ne ɛkwan a Onyankopɔn faa so bɔɔ ɔsoro ne asase ne deɛ ɛwɔ mu nyinaa.","mp3":"audio/readings/v032.mp3","dur":5.851},{"id":"v033","section":"genesis2","source":"Genesis 2:2 (Asante Twi Nkwa Asɛm)","tw":"Ɛduruu ɛda a ɛtɔ so nson no, na Onyankopɔn awie nnwuma a ɔhyɛɛ aseɛ yɛeɛ no nyinaa. Enti, ɛda a ɛtɔ so nson no, ɔgyee nʼahome.","mp3":"audio/readings/v033.mp3","dur":10.736},{"id":"v034","section":"genesis2","source":"Genesis 2:3 (Asante Twi Nkwa Asɛm)","tw":"Onyankopɔn hyiraa ɛda a ɛtɔ so nson no, na ɔtee ho. Ɛfiri sɛ, saa ɛda no na Onyankopɔn gyee nʼahome firii adebɔ nnwuma no nyinaa ho.","mp3":"audio/readings/v034.mp3","dur":13.793},{"id":"v035","section":"genesis2","source":"Genesis 2:4 (Asante Twi Nkwa Asɛm)","tw":"Yei ne ɔsoro ne asase bɔ ho asɛm. Ɛberɛ a Awurade Onyankopɔn bɔɔ ɔsoro ne asase no.","mp3":"audio/readings/v035.mp3","dur":8.542},{"id":"v036","section":"genesis2","source":"Genesis 2:5 (Asante Twi Nkwa Asɛm)","tw":"Na afifideɛ biara nni asase so, na wiram nnua biara nso nni hɔ. Ɛfiri sɛ, na Awurade Onyankopɔn mmaa nsuo ntɔɔ wɔ asase so, na onipa nso nni asase so a ɔbɛyɛ so adwuma.","mp3":"audio/readings/v036.mp3","dur":18.416},{"id":"v037","section":"genesis2","source":"Genesis 2:6 (Asante Twi Nkwa Asɛm)","tw":"Nanso, nsutire puepue fifirii asase mu bɛpetee asase ani nyinaa.","mp3":"audio/readings/v037.mp3","dur":7.863},{"id":"v038","section":"genesis2","source":"Genesis 2:7 (Asante Twi Nkwa Asɛm)","tw":"Awurade Onyankopɔn de asase no so dɔteɛ nwonoo onipa, na ɔhomee nkwa home guu ne hwene mu, maa onipa no bɛyɛɛ ɔteasefoɔ.","mp3":"audio/readings/v038.mp3","dur":10.214},{"id":"v039","section":"genesis2","source":"Genesis 2:8 (Asante Twi Nkwa Asɛm)","tw":"Afei, Awurade Onyankopɔn yɛɛ turo wɔ Eden apueeɛ fam, na ɛhɔ na ɔde onipa a ɔnwonoo no no tenaeɛ.","mp3":"audio/readings/v039.mp3","dur":10.109},{"id":"v040","section":"genesis2","source":"Genesis 2:9 (Asante Twi Nkwa Asɛm)","tw":"Awurade Onyankopɔn maa nnua ahodoɔ nyinaa fifirii asase no so; nnua a ɛyɛ fɛ na wɔdie. Turo no mfimfini no na nkwa dua, ɛnna papa ne bɔnehunu dua sisie.","mp3":"audio/readings/v040.mp3","dur":13.035},{"id":"v041","section":"genesis2","source":"Genesis 2:10 (Asante Twi Nkwa Asɛm)","tw":"Na nsuo tene firi Eden bɛgugu turo no mu afifideɛ no so; ɛfiri hɔ a, na saa nsuo no mu apaapae ayɛ nsubɔntene ɛnan.","mp3":"audio/readings/v041.mp3","dur":12.278},{"id":"v042","section":"genesis2","source":"Genesis 2:11 (Asante Twi Nkwa Asɛm)","tw":"Wɔtoo nsuo a apaapae no mu deɛ ɛdi ɛkan no edin Pison. Na ɛkontonkonton fa Hawila asase a sikakɔkɔɔ wɔ so no so nyinaa.","mp3":"audio/readings/v042.mp3","dur":12.696},{"id":"v043","section":"genesis2","source":"Genesis 2:12 (Asante Twi Nkwa Asɛm)","tw":"Na saa asase no so sikakɔkɔɔ yɛ. Na ɛhyɛ a ɛyɛ hwam ne apopobibirieboɔ nso wɔ hɔ.","mp3":"audio/readings/v043.mp3","dur":11.076},{"id":"v044","section":"genesis2","source":"Genesis 2:13 (Asante Twi Nkwa Asɛm)","tw":"Asubɔnten a ɛtɔ so mmienu no din de Gihon. Na ɛno ara na abobare afa Kus asase ho nyinaa.","mp3":"audio/readings/v044.mp3","dur":10.031},{"id":"v045","section":"genesis2","source":"Genesis 2:14 (Asante Twi Nkwa Asɛm)","tw":"Asuo a ɛtɔ so mmiɛnsa no, na wɔfrɛ no Tigris a ɛtene kɔ asase kɛseɛ Asiria apueeɛ fam. Asuo a ɛtɔ so ɛnan no nso, na wɔfrɛ no Eufrate.","mp3":"audio/readings/v045.mp3","dur":19.017},{"id":"v046","section":"genesis2","source":"Genesis 2:15 (Asante Twi Nkwa Asɛm)","tw":"Awurade Onyankopɔn faa onipa no de no kɔtenaa Eden turo mu hɔ sɛ ɔnyɛ mu adwuma, na ɔnhwɛ so.","mp3":"audio/readings/v046.mp3","dur":8.751},{"id":"v047","section":"genesis2","source":"Genesis 2:16 (Asante Twi Nkwa Asɛm)","tw":"Na Awurade Onyankopɔn bɔɔ onipa no kɔkɔ sɛ, “Wowɔ ho ɛkwan sɛ, wodi dua biara so aba wɔ turo yi mu ha;","mp3":"audio/readings/v047.mp3","dur":11.546},{"id":"v048","section":"genesis2","source":"Genesis 2:17 (Asante Twi Nkwa Asɛm)","tw":"nanso wonni ho ɛkwan sɛ wodi papa ne bɔnehunu dua no so aba. Ɛda a wobɛdie no, deɛ ɛbɛyɛ biara, wobɛwu.”","mp3":"audio/readings/v048.mp3","dur":12.147},{"id":"v049","section":"genesis2","source":"Genesis 2:18 (Asante Twi Nkwa Asɛm)","tw":"Afei, Awurade Onyankopɔn kaa sɛ, “Ɛnyɛ sɛ onipa nko ara tena; mɛbɔ ɔboafoɔ a ɔfata no ama no.”","mp3":"audio/readings/v049.mp3","dur":9.117},{"id":"v050","section":"genesis2","source":"Genesis 2:19 (Asante Twi Nkwa Asɛm)","tw":"Saa ɛberɛ no na, Awurade Onyankopɔn de mfuturo abɔ wiram mmoa ne ewiem nnomaa nyinaa. Enti, ɔde wɔn brɛɛ onipa sɛ ɔnhwehwɛ edin ko a ɔde bɛtoto wɔn. Edin a onipa de too abɔdeɛ a nkwa wɔ mu biara no, ɛno ara na ɛyɛɛ edin a wɔde frɛɛ no.","mp3":"audio/readings/v050.mp3","dur":23.171},{"id":"v051","section":"genesis2","source":"Genesis 2:20 (Asante Twi Nkwa Asɛm)","tw":"Enti, onipa totoo nyɛmmoa, ewiem nnomaa ne wiram mmoa no nyinaa edin. Nanso, onipa deɛ, wannya ɔboafoɔ a ɔfata no.","mp3":"audio/readings/v051.mp3","dur":11.024},{"id":"v052","section":"genesis2","source":"Genesis 2:21 (Asante Twi Nkwa Asɛm)","tw":"Enti, Awurade Onyankopɔn maa onipa daa nnahɔɔ. Ɛberɛ a onipa daa saa no, ɔyii ne mfe mu mpadeɛ baako, na ɔde honam taree deɛ ɔyii mpadeɛ hɔ no.","mp3":"audio/readings/v052.mp3","dur":14.42},{"id":"v053","section":"genesis2","source":"Genesis 2:22 (Asante Twi Nkwa Asɛm)","tw":"Afei, Awurade Onyankopɔn de mfe mu mpadeɛ baako a ɔyi firii onipa mu no bɔɔ ɔbaa, de no maa onipa no.","mp3":"audio/readings/v053.mp3","dur":10.344},{"id":"v054","section":"genesis2","source":"Genesis 2:23 (Asante Twi Nkwa Asɛm)","tw":"Na Adam kaa sɛ, “Mʼankasa me dompe ne me honam bi nie. Wɔbɛfrɛ yei ɔbaa ɛfiri sɛ, ɔbarima mu na wɔyii no firiiɛ.”","mp3":"audio/readings/v054.mp3","dur":9.352},{"id":"v055","section":"genesis2","source":"Genesis 2:24 (Asante Twi Nkwa Asɛm)","tw":"Yei enti na ɔbarima gya nʼagya ne ne na de ne ho kɔbata ne yere ho sɛdeɛ wɔn baanu bɛyɛ nnipa korɔ.","mp3":"audio/readings/v055.mp3","dur":9.012},{"id":"v056","section":"genesis2","source":"Genesis 2:25 (Asante Twi Nkwa Asɛm)","tw":"Saa ɛberɛ no, na ɔbarima ne ne yere nyinaa ho da hɔ, nanso na wɔmfɛre.","mp3":"audio/readings/v056.mp3","dur":9.091},{"id":"v057","section":"psalm119","source":"Psalm 119:1 (Asante Twi Nkwa Asɛm)","tw":"Nhyira nka wɔn a wɔn akwan yɛ pɛ na wɔnante sɛdeɛ Awurade mmara kyerɛ.","mp3":"audio/readings/v057.mp3","dur":5.642},{"id":"v058","section":"psalm119","source":"Psalm 119:5 (Asante Twi Nkwa Asɛm)","tw":"Ao sɛ mʼakwan bɛyɛ tee sɛdeɛ wo ɔhyɛ nsɛm no teɛ.","mp3":"audio/readings/v058.mp3","dur":6.504},{"id":"v059","section":"psalm119","source":"Psalm 119:7 (Asante Twi Nkwa Asɛm)","tw":"Mede akoma a emu teɛ bɛkamfo wo ɛberɛ a meresua wo mmara a ɛtene no.","mp3":"audio/readings/v059.mp3","dur":7.419},{"id":"v060","section":"psalm119","source":"Psalm 119:9 (Asante Twi Nkwa Asɛm)","tw":"Aberanteɛ bɛyɛ dɛn na nʼakwan ho ate? Ɛsɛ sɛ ɔdi wʼasɛm so.","mp3":"audio/readings/v060.mp3","dur":7.079},{"id":"v061","section":"psalm119","source":"Psalm 119:11 (Asante Twi Nkwa Asɛm)","tw":"Mede wʼasɛm asie mʼakoma mu sɛdeɛ merenyɛ bɔne ntia wo.","mp3":"audio/readings/v061.mp3","dur":4.389},{"id":"v062","section":"psalm119","source":"Psalm 119:12 (Asante Twi Nkwa Asɛm)","tw":"Ao Awurade, nkamfo wɔ wo; kyerɛkyerɛ me wo ɔhyɛ nsɛm.","mp3":"audio/readings/v062.mp3","dur":7.21},{"id":"v063","section":"psalm119","source":"Psalm 119:18 (Asante Twi Nkwa Asɛm)","tw":"Bue mʼani na menhunu anwanwadeɛ a ɛwɔ wo mmara no mu.","mp3":"audio/readings/v063.mp3","dur":5.198},{"id":"v064","section":"psalm119","source":"Psalm 119:19 (Asante Twi Nkwa Asɛm)","tw":"Meyɛ ɔnanani wɔ asase so; mfa wo mmaransɛm no nhinta me.","mp3":"audio/readings/v064.mp3","dur":6.087},{"id":"v065","section":"psalm119","source":"Psalm 119:24 (Asante Twi Nkwa Asɛm)","tw":"Wʼahyɛdeɛ yɛ mʼanigyedeɛ na ɛyɛ me fotufoɔ.","mp3":"audio/readings/v065.mp3","dur":5.068},{"id":"v066","section":"psalm119","source":"Psalm 119:25 (Asante Twi Nkwa Asɛm)","tw":"Woabrɛ me ase ma meda mfuturo mu. Kyɛe me nkwa so sɛdeɛ wʼasɛm no teɛ.","mp3":"audio/readings/v066.mp3","dur":7.027},{"id":"v067","section":"psalm119","source":"Psalm 119:28 (Asante Twi Nkwa Asɛm)","tw":"Awerɛhoɔ ama me ɔkra atɔ baha; hyɛ me den sɛdeɛ wʼasɛm no kyerɛ.","mp3":"audio/readings/v067.mp3","dur":6.583},{"id":"v068","section":"psalm119","source":"Psalm 119:31 (Asante Twi Nkwa Asɛm)","tw":"Ao Awurade, mek const SECTIONS=[
 {id:'genesis1',title:'Genesis 1',note:'All 31 verses, in her own voice.'},
 {id:'genesis2',title:'Genesis 2',note:'All 25 verses, in her own voice.'},
 {id:'psalm119',title:'Psalm 119',note:'The 70 verses she has recorded so far — not the whole psalm.'}
];
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shortRef(src){return String(src).replace(/\s*\(Asante Twi Nkwa Asɛm\)\s*$/,'')}
let audio=null, playingKey=null, queue=null, qIndex=-1, gapTimer=null;
function clearGap(){if(gapTimer){clearTimeout(gapTimer);gapTimer=null}}
function resetButtons(){
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('playing'));
 document.querySelectorAll('button.play').forEach(b=>{b.classList.remove('on');b.textContent='▶️ Play'});
 document.querySelectorAll('button.all').forEach(b=>{b.classList.remove('on');b.textContent='▶️ Play all'});
}
function stopAudio(){
 clearGap();
 if(audio){try{audio.pause();audio.removeAttribute('src');audio.load()}catch(e){}}
 audio=null;playingKey=null;queue=null;qIndex=-1;
 resetButtons();
}
function setAllButton(sectionId, running){
 if(!sectionId)return;
 const all=document.querySelector('button.all[data-all="'+sectionId+'"]');
 if(!all)return;
 all.textContent=running?'⏹ Stop':'▶️ Play all';
 all.classList.toggle('on',!!running);
}
function markPlaying(id, on){
 const card=$('row-'+id);if(card)card.classList.toggle('playing',on);
 const btn=document.querySelector('#row-'+id+' button.play');
 if(btn){btn.textContent=on?'🔊 Playing':'▶️ Play';btn.classList.toggle('on',on)}
 if(on&&card)card.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function playSrc(w, after, allId){
 $('msg').textContent='';
 audio=new Audio(w.mp3);
 playingKey=w.id;
 markPlaying(w.id,true);
 if(allId)setAllButton(allId,true);
 audio.addEventListener('ended',()=>{
  markPlaying(w.id,false);
  if(after)after();
 });
 audio.addEventListener('error',()=>{
  $('msg').textContent='Could not load the recording for '+shortRef(w.source)+' ('+w.id+').';
  markPlaying(w.id,false);
  queue=null;resetButtons();
 });
 const p=audio.play();
 if(p&&p.catch)p.catch(()=>{$('msg').textContent='Could not play this one.';markPlaying(w.id,false);queue=null;resetButtons()});
}
function playOne(id){
 const w=LINES.find(x=>x.id===id);if(!w||!w.mp3)return;
 const same=playingKey===id && audio && !audio.paused && !queue;
 stopAudio();
 if(same)return;
 playSrc(w,()=>{playingKey=null;const card=$('row-'+id);if(card)card.classList.remove('playing');const btn=document.querySelector('#row-'+id+' button.play');if(btn){btn.textContent='▶️ Play';btn.classList.remove('on')}});
}
function playNext(){
 if(!queue)return;
 qIndex++;
 if(qIndex>=queue.length){const sid=queue._section;stopAudio();return}
 const w=queue[qIndex];
 const sid=queue._section;
 clearGap();
 gapTimer=setTimeout(()=>{gapTimer=null;playSrc(w,playNext,sid)}, qIndex===0?0:350);
}
function playAll(sectionId){
 const running=queue && queue._section===sectionId && (audio && !audio.paused || gapTimer);
 stopAudio();
 if(running)return;
 queue=LINES.filter(x=>x.section===sectionId && x.mp3);
 queue._section=sectionId;
 if(!queue.length){$('msg').textContent='No recordings in this section yet.';return}
 qIndex=-1;
 const all=document.querySelector('button.all[data-all="'+sectionId+'"]');
 if(all){all.textContent='⏹ Stop';all.classList.add('on')}
 playNext();
}
(function render(){
 const L=$('list');L.innerHTML='';
 SECTIONS.forEach(sec=>{
  const wrap=document.createElement('section');
  wrap.className='sec';
  wrap.id=sec.id;
  wrap.innerHTML=`<h2>${esc(sec.title)}</h2>
   <p class="note">${esc(sec.note)} <span class="credit">Voice: Sikayere</span></p>
   <div class="secbar"><button type="button" class="all" data-all="${sec.id}">▶️ Play all</button></div>
   <div class="sec-list" id="list-${sec.id}"></div>`;
  L.appendChild(wrap);
  const box=$('list-'+sec.id);
  LINES.filter(w=>w.section===sec.id).forEach(w=>{
   const d=document.createElement('div');
   d.className='card part';
   d.id='row-'+w.id;
   d.innerHTML=`<div class="sub">${esc(shortRef(w.source))} · ${esc(w.id)}</div>
    <div class="word" lang="tw">${esc(w.tw)}</div>
    <div class="row" style="margin-top:10px"><button type="button" class="play" data-play="${w.id}">▶️ Play</button></div>`;
   box.appendChild(d);
  });
 });
 L.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playOne(b.dataset.play));
 L.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>playAll(b.dataset.all));
})();
</script>
