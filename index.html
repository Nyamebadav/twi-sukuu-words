<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twi Sukuu · Preschool Word Recorder</title>
<style>
:root{--g:#0a7d3b;--y:#f2b705;--r:#c0392b;--bg:#fffaf0;--card:#fff;--ink:#222}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(90deg,var(--r),var(--y),var(--g));color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.3rem;text-shadow:0 1px 2px #0006}header p{margin:4px 0 0;font-size:.85rem;text-shadow:0 1px 2px #0006}
main{max-width:640px;margin:auto;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.prog{flex:1;height:10px;background:#ddd;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g);width:0}
input{font-size:1rem;padding:10px;border:1px solid #ccc;border-radius:10px;width:100%}
button{font-size:1rem;padding:10px 14px;border:0;border-radius:12px;cursor:pointer;background:#eee}
button.rec{background:var(--r);color:#fff}button.rec.on{animation:p 1s infinite}button.go{background:var(--g);color:#fff}
button:disabled{opacity:.45}@keyframes p{50%{opacity:.5}}
.card{background:var(--card);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0002}
.word{font-size:1.5rem;font-weight:700}.twi{color:#555;margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}audio{width:100%;margin-top:8px}
.done{border-left:6px solid var(--g)}.tag{font-size:.8rem;color:var(--g);font-weight:700}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.note{font-size:.85rem;color:#666}
#msg{color:var(--r);font-weight:600}
</style>
</head>
<body>
<header><h1>📚 Twi Sukuu · My Voice Words</h1><p>Tap Record, say the word, tap Stop. Listen, then keep it or re-record.</p></header>
<main>
<div class="card">
 <label class="note">Your name (goes into the file names)</label>
 <input id="speaker" placeholder="e.g. Ama">
 <div class="bar"><div class="prog"><i id="pi"></i></div><span id="pt">0 / 0</span></div>
 <div class="row">
  <button class="go" id="dl" disabled>⬇️ Download All (zip)</button>
  <button id="dlEach" disabled>Download one by one</button>
 </div>
 <p id="msg"></p>
</div>
<div class="card">
 <b>Add a word</b>
 <div class="add" style="margin-top:8px"><input id="nw" placeholder="English word"><input id="nt" placeholder="Twi (optional)"><button id="addb">Add</button></div>
</div>
<div id="list"></div>
<p class="note">Recordings stay on this phone (saved in the browser) until you download them. Nothing is uploaded anywhere.</p>
</main>
<script>
const STARTER=[["hello",""],["goodbye",""],["please",""],["thank you","medaase"],["yes","aane"],["no","daabi"],["water","nsuo"],["food","aduane"],["mother","maame"],["father","papa"],["friend","adamfo"],["play","di agorɔ"],["sleep","da"],["school","sukuu"],["tree","dua"],["sun","awia"],["moon","bosome"],["star","nsoromma"],["bird","anomaa"],["fish","nam"],["cat","agyinamoa"],["dog","kraman"]];
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>({en:'Letter '+l,tw:''}));
const TWI_ABC='a b d e ɛ f g h i k l m n o ɔ p r s t u w y'.split(' ').map(l=>({en:'Twi letter '+l,tw:l}));
let words;try{words=JSON.parse(LS.get('tsw_words')||'null')}catch(e){words=null}
if(!Array.isArray(words)||!words.length)words=STARTER.map(([en,tw])=>({en,tw})).concat(ABC,TWI_ABC);
const PANGRAM={en:'The quick brown fox jumps over the lazy dog.',tw:'',pangram:true};
if(!words.some(w=>w.en===PANGRAM.en))words.push(PANGRAM);
const clips={};let db,rec=null,stream=null,chunks=[],recKey=null;
const $=id=>document.getElementById(id);
$('speaker').value=LS.get('tsw_speaker')||'';$('speaker').oninput=e=>LS.set('tsw_speaker',e.target.value);
const keyOf=w=>w.en.trim().toLowerCase();
function saveWords(){LS.set('tsw_words',JSON.stringify(words))}
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej('no idb');const r=indexedDB.open('twi-sukuu-preschool',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(k,v){if(!db)return Promise.resolve();return new Promise(r=>{const t=db.transaction('clips','readwrite');v===null?t.objectStore('clips').delete(k):t.objectStore('clips').put(v,k);t.oncomplete=r})}
function all(){return new Promise(r=>{const out={},t=db.transaction('clips').objectStore('clips').openCursor();t.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else r(out)}})}
function render(){const L=$('list');L.innerHTML='';let n=0;
 words.forEach((w,i)=>{const k=keyOf(w),c=clips[k];if(c)n++;
  const d=document.createElement('div');d.className='card'+(c?' done':'');
  d.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="word">${esc(w.en)}</div><div class="twi">${w.pangram?'<span class="note">Pangram: uses every letter A to Z</span>':(w.tw?'Twi: '+esc(w.tw):'<span class="note">Twi: (add later)</span>')}</div></div>${c?'<span class="tag">✓ recorded</span>':''}</div>
  <div class="row"><button class="rec" data-k="${i}">${recKey===k?'⏹ Stop':(c?'🔁 Re-record':'🎙 Record')}</button>${c?`<button data-del="${i}">Delete</button>`:''}${w.custom?`<button data-rm="${i}">Remove word</button>`:''}</div>
  ${c?`<audio controls src="${URL.createObjectURL(c.blob)}"></audio>`:''}`;
  if(recKey===k)d.querySelector('.rec').classList.add('on');L.appendChild(d)});
 $('pt').textContent=`${n} / ${words.length}`;$('pi').style.width=(words.length?100*n/words.length:0)+'%';$('dl').disabled=$('dlEach').disabled=!n;
 L.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>toggle(words[+b.dataset.k]));
 L.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const k=keyOf(words[+b.dataset.del]);delete clips[k];await put(k,null);render()});
 L.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const w=words[+b.dataset.rm];if(!confirm('Remove "'+w.en+'"?'))return;delete clips[keyOf(w)];await put(keyOf(w),null);words.splice(+b.dataset.rm,1);saveWords();render()});
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function toggle(w){const k=keyOf(w);$('msg').textContent='';
 if(rec&&recKey===k){rec.stop();return}
 if(rec){rec.stop()}
 try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
 catch(e){$('msg').textContent='Microphone blocked. Allow the microphone for this page in your browser settings, then try again.';return}
 chunks=[];rec=new MediaRecorder(stream);recKey=k;
 rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=async()=>{const raw=new Blob(chunks,{type:rec.mimeType||'audio/webm'});rec=null;recKey=null;
  let blob=raw,ext=(raw.type.includes('mp4')?'m4a':'webm');
  try{blob=await toWav(raw);ext='wav'}catch(e){}
  clips[k]={blob,ext,en:w.en,tw:w.tw||'',at:new Date().toISOString()};await put(k,clips[k]);render()};
 rec.start();render()}
async function toWav(b){const ac=new (window.AudioContext||window.webkitAudioContext)();const buf=await ac.decodeAudioData(await b.arrayBuffer());ac.close&&ac.close();
 const ch=buf.getChannelData(0),sr=buf.sampleRate,n=ch.length,v=new DataView(new ArrayBuffer(44+n*2));
 const s=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,ch[i]));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true)}return new Blob([v],{type:'audio/wav'})}
const slug=s=>s.trim().toLowerCase().replace(/[^a-z0-9ɛɔ]+/g,'_').replace(/^_|_$/g,'')||'word';
function files(){const sp=slug($('speaker').value||'speaker');const out=[];let csv='\ufefffilename,english,twi,speaker,recorded_at\n';let i=0;
 words.forEach(w=>{const c=clips[keyOf(w)];if(!c)return;i++;const fn=`${String(i).padStart(3,'0')}_${slug(w.en)}_${sp}.${c.ext}`;out.push([fn,c.blob]);
  csv+=[fn,w.en,w.tw||'',$('speaker').value||'',c.at].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')+'\n'});
 out.push(['transcript.csv',new Blob([csv],{type:'text/csv'})]);
 out.push(['metadata.txt',new Blob([`Twi Sukuu Translator Village - preschool word recordings\nSpeaker: ${$('speaker').value||''}\nExported: ${new Date().toString()}\nClips: ${i}\n`])]);return out}
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
async function zip(list){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const [name,blob] of list){const d=new Uint8Array(await blob.arrayBuffer()),nm=enc.encode(name),c=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  parts.push(h,nm,d);const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);cd.push(e,nm);off+=30+nm.length+d.length}
 const cdSize=cd.reduce((a,x)=>a+(x.byteLength),0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,list.length,true);end.setUint16(10,list.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cd,end],{type:'application/zip'})}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
$('dl').onclick=async()=>{const z=await zip(files());save(z,`twi-sukuu-preschool-${slug($('speaker').value||'speaker')}-${new Date().toISOString().slice(0,10)}.zip`)};
$('dlEach').onclick=async()=>{for(const [n,b] of files()){save(b,n);await new Promise(r=>setTimeout(r,600))}};
$('addb').onclick=()=>{const en=$('nw').value.trim();if(!en)return;if(words.some(w=>keyOf(w)===en.toLowerCase())){$('msg').textContent='That word is already on the list.';return}words.push({en,tw:$('nt').value.trim(),custom:true});saveWords();$('nw').value=$('nt').value='';render();window.scrollTo(0,document.body.scrollHeight)};
render();
(async()=>{try{db=await openDB();Object.assign(clips,await all());render()}catch(e){db=null;$('msg').textContent='Note: this browser will not keep recordings after closing the page. Download before you leave.'}})();
window.onerror=(m)=>{$('msg').textContent='Error: '+m};
</script>
</body>
</html>
